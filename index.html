<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light" />
    <title>ARGB Controller</title>
    <style>
      /* ============================================================
         Tokens
         ============================================================ */
      :root {
        color-scheme: light;

        --bg: #f4f6fc;

        --surface: #ffffff;
        --surface-2: #fafbfe;
        --field: #f7f8fd;
        --field-focus: #ffffff;

        --border: #e8ebf4;
        --border-strong: #dbe0ee;
        --border-hover: #bcc4da;

        --text: #1a1f33;
        --text-muted: #5f6782;
        --text-faint: #98a0b6;

        --accent: #5b6cff;
        --accent-2: #a855f7;
        --accent-soft: rgba(91, 108, 255, 0.1);
        --accent-line: rgba(91, 108, 255, 0.55);

        --danger: #e5484d;
        --danger-soft: rgba(229, 72, 77, 0.09);
        --success: #17a673;
        --success-soft: rgba(23, 166, 115, 0.1);

        --radius: 16px;
        --radius-sm: 12px;
        --radius-xs: 10px;

        --ease: cubic-bezier(0.22, 0.7, 0.3, 1);

        --shadow-card: 0 1px 2px rgba(20, 26, 50, 0.04),
          0 12px 28px -20px rgba(20, 26, 50, 0.22);
        --shadow-pop: 0 10px 24px -12px rgba(20, 26, 50, 0.22);
      }

      /* ============================================================
         Base
         ============================================================ */
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html {
        -webkit-text-size-adjust: 100%;
      }

      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
          "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
        background-color: var(--bg);
        background-image: radial-gradient(
            900px 520px at 6% -8%,
            rgba(91, 108, 255, 0.09),
            transparent 62%
          ),
          radial-gradient(
            820px 520px at 98% 2%,
            rgba(168, 85, 247, 0.075),
            transparent 60%
          ),
          radial-gradient(
            900px 560px at 50% 110%,
            rgba(23, 166, 115, 0.045),
            transparent 65%
          );
        background-attachment: fixed;
        color: var(--text);
        line-height: 1.55;
        min-height: 100vh;
        padding: 32px 20px 56px;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }

      ::selection {
        background: rgba(91, 108, 255, 0.22);
      }

      :focus-visible {
        outline: 2px solid var(--accent-line);
        outline-offset: 2px;
      }

      ::-webkit-scrollbar {
        width: 10px;
        height: 10px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      ::-webkit-scrollbar-thumb {
        background: rgba(20, 26, 50, 0.16);
        border: 3px solid transparent;
        border-radius: 999px;
        background-clip: content-box;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: rgba(20, 26, 50, 0.28);
        background-clip: content-box;
      }

      .container {
        max-width: 1000px;
        margin: 0 auto;
      }

      /* ============================================================
         Topbar
         ============================================================ */
      .topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        flex-wrap: wrap;
        padding: 16px 20px;
        margin-bottom: 20px;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        box-shadow: var(--shadow-card);
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 13px;
        min-width: 0;
      }

      .brand-icon {
        position: relative;
        flex: none;
        width: 40px;
        height: 40px;
        border-radius: 13px;
        display: grid;
        place-items: center;
        color: #fff;
        background: linear-gradient(
          135deg,
          var(--accent) 0%,
          var(--accent-2) 100%
        );
        box-shadow: 0 8px 18px -8px rgba(91, 108, 255, 0.85),
          inset 0 1px 0 rgba(255, 255, 255, 0.4);
      }

      .brand-icon::after {
        content: "";
        position: absolute;
        inset: 0;
        border-radius: inherit;
        background: radial-gradient(
          circle at 28% 20%,
          rgba(255, 255, 255, 0.55),
          transparent 60%
        );
        opacity: 0.7;
        pointer-events: none;
      }

      .brand-icon svg {
        position: relative;
        width: 21px;
        height: 21px;
        transition: transform 0.7s var(--ease);
      }

      .brand:hover .brand-icon svg {
        transform: rotate(90deg);
      }

      .brand-text {
        min-width: 0;
      }

      .brand-text h1 {
        font-size: 15.5px;
        font-weight: 700;
        letter-spacing: 0.4px;
        line-height: 1.2;
        background: linear-gradient(
          110deg,
          var(--accent) 0%,
          var(--accent-2) 100%
        );
        -webkit-background-clip: text;
        background-clip: text;
        -webkit-text-fill-color: transparent;
        color: transparent;
      }

      .brand-text p {
        font-size: 11px;
        color: var(--text-faint);
        letter-spacing: 0.3px;
        margin-top: 2px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .conn-group {
        display: flex;
        align-items: center;
        gap: 9px;
        flex-wrap: wrap;
      }

      .conn-group input {
        width: 148px;
        padding: 9px 14px;
        font-family: inherit;
        font-size: 13px;
        color: var(--text);
        background: var(--field);
        border: 1px solid var(--border-strong);
        border-radius: var(--radius-xs);
        transition: border-color 0.18s, box-shadow 0.18s, background 0.18s;
      }

      .conn-group input::placeholder {
        color: var(--text-faint);
      }

      .conn-group input:hover:not(:disabled) {
        border-color: var(--border-hover);
      }

      .conn-group input:focus {
        outline: none;
        background: var(--field-focus);
        border-color: var(--accent-line);
        box-shadow: 0 0 0 3px var(--accent-soft);
      }

      .conn-group input:disabled {
        color: var(--text-faint);
        background: #f2f4fa;
        cursor: not-allowed;
        border-color: var(--border);
      }

      /* ---------- Status pill ---------- */
      .status-dot {
        display: inline-flex;
        align-items: center;
        gap: 7px;
        padding: 6px 13px;
        border-radius: 999px;
        font-size: 12px;
        font-weight: 600;
        letter-spacing: 0.2px;
        border: 1px solid transparent;
        transition: background 0.2s, color 0.2s, border-color 0.2s;
        white-space: nowrap;
      }

      .status-dot::before {
        content: "";
        width: 7px;
        height: 7px;
        border-radius: 50%;
        flex: none;
      }

      .status-dot.connected {
        background: var(--success-soft);
        color: var(--success);
        border-color: rgba(23, 166, 115, 0.24);
      }

      .status-dot.connected::before {
        background: var(--success);
        animation: pulse 2.2s ease-out infinite;
      }

      .status-dot.disconnected {
        background: var(--danger-soft);
        color: var(--danger);
        border-color: rgba(229, 72, 77, 0.2);
      }

      .status-dot.disconnected::before {
        background: var(--danger);
      }

      @keyframes pulse {
        0% {
          box-shadow: 0 0 0 0 rgba(23, 166, 115, 0.5);
        }
        70% {
          box-shadow: 0 0 0 6px rgba(23, 166, 115, 0);
        }
        100% {
          box-shadow: 0 0 0 0 rgba(23, 166, 115, 0);
        }
      }

      /* ============================================================
         Buttons
         ============================================================ */
      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 7px;
        padding: 9px 18px;
        font-family: inherit;
        font-size: 13px;
        font-weight: 600;
        letter-spacing: 0.2px;
        white-space: nowrap;
        color: var(--text);
        background: var(--surface);
        border: 1px solid var(--border-strong);
        border-radius: var(--radius-xs);
        cursor: pointer;
        transition: transform 0.16s var(--ease), background 0.16s,
          border-color 0.16s, box-shadow 0.16s, color 0.16s;
      }

      .btn:hover:not(:disabled) {
        background: #fbfcff;
        border-color: var(--border-hover);
        transform: translateY(-1px);
        box-shadow: var(--shadow-pop);
      }

      .btn:active:not(:disabled) {
        transform: translateY(0) scale(0.985);
      }

      .btn:disabled {
        opacity: 0.45;
        cursor: not-allowed;
      }

      .btn-primary {
        color: #fff;
        background: linear-gradient(
          135deg,
          var(--accent) 0%,
          var(--accent-2) 100%
        );
        border-color: transparent;
        box-shadow: 0 8px 18px -9px rgba(91, 108, 255, 0.9),
          inset 0 1px 0 rgba(255, 255, 255, 0.3);
      }

      .btn-primary:hover:not(:disabled) {
        background: linear-gradient(135deg, #6d7dff 0%, #b566ff 100%);
        border-color: transparent;
        box-shadow: 0 14px 26px -10px rgba(91, 108, 255, 0.95),
          inset 0 1px 0 rgba(255, 255, 255, 0.4);
      }

      .btn-danger {
        color: #fff;
        background: linear-gradient(135deg, #ef5350 0%, #d93a45 100%);
        border-color: transparent;
        box-shadow: 0 8px 18px -9px rgba(229, 72, 77, 0.85),
          inset 0 1px 0 rgba(255, 255, 255, 0.26);
      }

      .btn-danger:hover:not(:disabled) {
        background: linear-gradient(135deg, #f56a67 0%, #e34a55 100%);
        border-color: transparent;
      }

      /* ============================================================
         Grid layout
         ============================================================ */
      .grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 16px;
        align-items: start;
      }

      .card-span-2 {
        grid-column: span 2;
      }

      /* ============================================================
         Cards
         ============================================================ */
      .card {
        position: relative;
        overflow: hidden;
        padding: 22px 24px;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        box-shadow: var(--shadow-card);
        transition: border-color 0.2s, box-shadow 0.2s, transform 0.2s var(--ease);
        animation: rise 0.55s var(--ease) both;
      }

      .card:hover {
        border-color: var(--border-strong);
        box-shadow: 0 1px 2px rgba(20, 26, 50, 0.05),
          0 18px 38px -22px rgba(20, 26, 50, 0.3);
      }

      .card::before {
        content: "";
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        height: 3px;
        background: linear-gradient(
          90deg,
          var(--accent) 0%,
          var(--accent-2) 70%,
          rgba(168, 85, 247, 0) 100%
        );
        opacity: 0.9;
      }

      .card:nth-child(1) {
        animation-delay: 0.03s;
      }
      .card:nth-child(2) {
        animation-delay: 0.07s;
      }
      .card:nth-child(3) {
        animation-delay: 0.11s;
      }
      .card:nth-child(4) {
        animation-delay: 0.15s;
      }

      @keyframes rise {
        from {
          opacity: 0;
          transform: translateY(12px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .card-title {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-bottom: 18px;
        font-size: 13.5px;
        font-weight: 700;
        letter-spacing: 0.3px;
        color: var(--text);
      }

      .card-title::before {
        content: "";
        width: 3px;
        height: 15px;
        border-radius: 3px;
        flex: none;
        background: linear-gradient(180deg, var(--accent), var(--accent-2));
      }

      .card-title small {
        margin-left: auto;
        font-size: 11px;
        font-weight: 500;
        letter-spacing: 0.2px;
        color: var(--text-faint);
      }

      /* ============================================================
         Rows & color inputs
         ============================================================ */
      .row {
        display: flex;
        align-items: center;
        gap: 12px;
        flex-wrap: wrap;
      }

      input[type="color"] {
        -webkit-appearance: none;
        appearance: none;
        display: block;
        padding: 0;
        border: none;
        background: transparent;
        cursor: pointer;
        transition: transform 0.18s var(--ease), box-shadow 0.18s;
      }

      input[type="color"]::-webkit-color-swatch-wrapper {
        padding: 0;
      }

      input[type="color"]::-webkit-color-swatch {
        border: 1px solid rgba(20, 26, 50, 0.12);
        border-radius: 11px;
        box-shadow: inset 0 1px 3px rgba(20, 26, 50, 0.08);
      }

      input[type="color"]::-moz-color-swatch {
        border: 1px solid rgba(20, 26, 50, 0.12);
        border-radius: 11px;
        box-shadow: inset 0 1px 3px rgba(20, 26, 50, 0.08);
      }

      input[type="color"]:hover {
        transform: translateY(-2px);
        box-shadow: 0 10px 20px -10px rgba(20, 26, 50, 0.35);
      }

      .row input[type="color"] {
        width: 58px;
        height: 44px;
      }

      /* ---------- Segment grid ---------- */
      .seg-grid {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 12px;
        margin-bottom: 18px;
      }

      .seg-item {
        padding: 10px 10px 12px;
        background: var(--surface-2);
        border: 1px solid var(--border);
        border-radius: 14px;
        transition: background 0.2s, border-color 0.2s, transform 0.2s var(--ease),
          box-shadow 0.2s;
      }

      .seg-item:hover {
        background: #fff;
        border-color: var(--border-strong);
        transform: translateY(-2px);
        box-shadow: 0 10px 22px -16px rgba(20, 26, 50, 0.3);
      }

      .seg-item input[type="color"] {
        width: 100%;
        height: 64px;
      }

      .seg-item input[type="color"]::-webkit-color-swatch {
        border-radius: 12px;
      }
      .seg-item input[type="color"]::-moz-color-swatch {
        border-radius: 12px;
      }

      .seg-label {
        margin-bottom: 8px;
        text-align: center;
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.6px;
        color: var(--text-muted);
      }

      /* ---------- Rotation slider row ---------- */
      .rotation-row {
        display: flex;
        align-items: center;
        gap: 14px;
        margin-bottom: 18px;
        font-size: 12.5px;
        font-weight: 600;
        color: var(--text-muted);
      }

      .rotation-row input[type="range"] {
        flex: 1;
        min-width: 100px;
      }

      .rotation-row .val {
        min-width: 50px;
        text-align: right;
        font-family: ui-monospace, "SF Mono", Consolas, monospace;
        font-size: 13px;
        font-weight: 700;
        color: var(--accent);
        font-variant-numeric: tabular-nums;
      }

      /* ---------- Presets ---------- */
      .presets {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
        align-items: flex-start;
        margin-top: 16px;
      }

      .preset {
        width: 34px;
        height: 34px;
        border-radius: var(--radius-xs);
        border: 1px solid rgba(20, 26, 50, 0.1);
        box-shadow: 0 1px 3px rgba(20, 26, 50, 0.1);
        cursor: pointer;
        transition: transform 0.18s var(--ease), box-shadow 0.18s;
      }

      .preset:hover {
        transform: translateY(-3px) scale(1.06);
        box-shadow: 0 10px 20px -10px rgba(20, 26, 50, 0.4),
          0 0 0 2px rgba(91, 108, 255, 0.28);
      }

      .preset-strip {
        display: flex;
        overflow: hidden;
        width: 76px;
        height: 34px;
        border-radius: var(--radius-xs);
        border: 1px solid rgba(20, 26, 50, 0.1);
        box-shadow: 0 1px 3px rgba(20, 26, 50, 0.1);
        cursor: pointer;
        transition: transform 0.18s var(--ease), box-shadow 0.18s;
      }

      .preset-strip:hover {
        transform: translateY(-3px);
        box-shadow: 0 10px 22px -12px rgba(20, 26, 50, 0.4),
          0 0 0 2px rgba(91, 108, 255, 0.32);
      }

      .preset-strip span {
        flex: 1;
        height: 100%;
      }

      .preset-item {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 6px;
      }

      .preset-name {
        font-size: 11px;
        font-weight: 500;
        color: var(--text-faint);
        transition: color 0.18s;
      }

      .preset-item:hover .preset-name {
        color: var(--text-muted);
      }

      /* ============================================================
         Inputs — textarea / time / range
         ============================================================ */
      textarea {
        width: 100%;
        min-height: 78px;
        padding: 12px 14px;
        margin-bottom: 14px;
        font-family: ui-monospace, "SF Mono", "JetBrains Mono", Consolas,
          monospace;
        font-size: 12.5px;
        line-height: 1.7;
        letter-spacing: 0.3px;
        color: var(--text);
        background: var(--field);
        border: 1px solid var(--border-strong);
        border-radius: var(--radius-sm);
        resize: vertical;
        transition: border-color 0.18s, box-shadow 0.18s, background 0.18s;
      }

      textarea::placeholder {
        color: var(--text-faint);
      }

      textarea:hover {
        border-color: var(--border-hover);
      }

      textarea:focus {
        outline: none;
        background: var(--field-focus);
        border-color: var(--accent-line);
        box-shadow: 0 0 0 3px var(--accent-soft);
      }

      input[type="time"] {
        padding: 9px 14px;
        font-family: inherit;
        font-size: 13px;
        font-variant-numeric: tabular-nums;
        color: var(--text);
        background: var(--field);
        border: 1px solid var(--border-strong);
        border-radius: var(--radius-xs);
        transition: border-color 0.18s, box-shadow 0.18s, background 0.18s;
      }

      input[type="time"]:hover {
        border-color: var(--border-hover);
      }

      input[type="time"]:focus {
        outline: none;
        background: var(--field-focus);
        border-color: var(--accent-line);
        box-shadow: 0 0 0 3px var(--accent-soft);
      }

      /* ---------- Range ---------- */
      input[type="range"] {
        -webkit-appearance: none;
        appearance: none;
        height: 20px;
        background: transparent;
        cursor: pointer;
      }

      input[type="range"]::-webkit-slider-runnable-track {
        height: 4px;
        border-radius: 999px;
        background: #e2e6f2;
      }

      input[type="range"]::-webkit-slider-thumb {
        -webkit-appearance: none;
        appearance: none;
        width: 16px;
        height: 16px;
        margin-top: -6px;
        border-radius: 50%;
        border: 2px solid #fff;
        background: linear-gradient(135deg, var(--accent), var(--accent-2));
        box-shadow: 0 1px 4px rgba(20, 26, 50, 0.28),
          0 0 0 1px rgba(91, 108, 255, 0.35);
        transition: transform 0.15s var(--ease), box-shadow 0.15s;
      }

      input[type="range"]:hover::-webkit-slider-thumb {
        transform: scale(1.16);
        box-shadow: 0 2px 8px rgba(20, 26, 50, 0.3),
          0 0 0 1px rgba(91, 108, 255, 0.55);
      }

      input[type="range"]::-moz-range-track {
        height: 4px;
        border-radius: 999px;
        background: #e2e6f2;
      }

      input[type="range"]::-moz-range-thumb {
        width: 14px;
        height: 14px;
        border-radius: 50%;
        border: 2px solid #fff;
        background: linear-gradient(135deg, var(--accent), var(--accent-2));
        box-shadow: 0 1px 4px rgba(20, 26, 50, 0.28);
      }

      /* ============================================================
         Gradient controls
         ============================================================ */
      .gradient-controls {
        display: flex;
        align-items: center;
        gap: 22px;
        flex-wrap: wrap;
      }

      .speed-row {
        display: flex;
        align-items: center;
        gap: 12px;
        flex: 1;
        min-width: 180px;
        font-size: 12.5px;
        font-weight: 600;
        color: var(--text-muted);
      }

      .speed-row input[type="range"] {
        flex: 1;
        min-width: 80px;
      }

      .speed-row .val {
        min-width: 26px;
        text-align: center;
        font-family: ui-monospace, "SF Mono", Consolas, monospace;
        font-size: 13px;
        font-weight: 700;
        color: var(--accent);
        font-variant-numeric: tabular-nums;
      }

      .help {
        margin-top: 12px;
        font-size: 11.5px;
        line-height: 1.65;
        color: var(--text-faint);
      }

      /* ============================================================
         Schedule
         ============================================================ */
      .schedule-row {
        display: flex;
        align-items: center;
        gap: 10px;
        flex-wrap: wrap;
        font-size: 12.5px;
        font-weight: 600;
        color: var(--text-muted);
      }

      /* ============================================================
         Footer
         ============================================================ */
      footer {
        margin-top: 34px;
        padding: 16px;
        text-align: center;
        font-size: 11px;
        letter-spacing: 0.5px;
        color: var(--text-faint);
      }

      /* ============================================================
         Responsive
         ============================================================ */
      @media (max-width: 760px) {
        .grid {
          grid-template-columns: 1fr;
        }

        .card-span-2 {
          grid-column: span 1;
        }
      }

      @media (max-width: 640px) {
        body {
          padding: 18px 12px 40px;
        }

        .topbar {
          padding: 14px 16px;
          gap: 12px;
        }

        .brand-icon {
          width: 36px;
          height: 36px;
          border-radius: 11px;
        }

        .brand-text h1 {
          font-size: 14px;
        }

        .conn-group {
          width: 100%;
        }

        .conn-group input {
          flex: 1 1 120px;
          width: auto;
          min-width: 0;
        }

        .card {
          padding: 18px 16px;
          border-radius: 14px;
        }

        .card-title {
          font-size: 13px;
          margin-bottom: 16px;
        }

        .seg-grid {
          gap: 8px;
        }

        .seg-item {
          padding: 8px 6px 10px;
          border-radius: 12px;
        }

        .seg-item input[type="color"] {
          height: 46px;
        }

        .seg-item input[type="color"]::-webkit-color-swatch {
          border-radius: 9px;
        }

        .seg-label {
          font-size: 10px;
          letter-spacing: 0.3px;
        }

        .preset {
          width: 30px;
          height: 30px;
        }

        .preset-strip {
          width: 64px;
          height: 30px;
        }

        .row input[type="color"] {
          width: 52px;
          height: 40px;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 0.01ms !important;
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <!-- ================= Topbar ================= -->
      <div class="topbar">
        <div class="brand">
          <div class="brand-icon">
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2.2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <circle cx="12" cy="12" r="3" />
              <path
                d="M12 1v3M12 20v3M4.22 4.22l2.12 2.12M17.66 17.66l2.12 2.12M1 12h3M20 12h3M4.22 19.78l2.12-2.12M17.66 6.34l2.12-2.12"
              />
            </svg>
          </div>
          <div class="brand-text">
            <h1>ARGB Controller</h1>
            <p>ESP32 · 4-段 ARGB 风扇控制</p>
          </div>
        </div>

        <div class="conn-group">
          <input type="text" id="portInput" placeholder="COM5" />
          <span id="connectionStatus" class="status-dot disconnected"
            >未连接</span
          >
          <button
            id="toggleConnectionBtn"
            class="btn btn-primary"
            onclick="toggleConnection()"
          >
            连接
          </button>
        </div>
      </div>

      <!-- ================= Grid ================= -->
      <div class="grid">
        <!-- 单色模式 -->
        <div class="card">
          <div class="card-title">
            单色模式 <small>整圈统一一种颜色</small>
          </div>
          <div class="row">
            <input type="color" id="singleColor" value="#ffffff" />
            <button class="btn btn-primary" onclick="applySingleColor()">
              应用
            </button>
            <button class="btn" onclick="turnOff()">关闭灯光</button>
          </div>
          <div class="presets" id="singlePresets"></div>
        </div>

        <!-- 定时关闭 -->
        <div class="card">
          <div class="card-title">
            定时关闭 <small>到点自动熄灯</small>
          </div>
          <div class="schedule-row">
            <span>从</span>
            <input type="time" id="startTime" value="00:00" />
            <span>到</span>
            <input type="time" id="endTime" value="08:00" />
            <button class="btn btn-primary" onclick="applySchedule()">
              应用
            </button>
          </div>
          <div class="help">
            在设定时间段内灯光自动关闭，其余时间恢复正常显示。
          </div>
        </div>

        <!-- 分段模式 -->
        <div class="card card-span-2">
          <div class="card-title">
            分段模式 <small>4 段 × 4 颗 LED</small>
          </div>

          <div class="seg-grid">
            <div class="seg-item">
              <div class="seg-label">段 1</div>
              <input type="color" id="segColor0" value="#ff0000" />
            </div>
            <div class="seg-item">
              <div class="seg-label">段 2</div>
              <input type="color" id="segColor1" value="#00ff00" />
            </div>
            <div class="seg-item">
              <div class="seg-label">段 3</div>
              <input type="color" id="segColor2" value="#0000ff" />
            </div>
            <div class="seg-item">
              <div class="seg-label">段 4</div>
              <input type="color" id="segColor3" value="#ffff00" />
            </div>
          </div>

          <div class="rotation-row">
            <span>旋转角度</span>
            <input
              type="range"
              id="segRotation"
              min="0"
              max="360"
              step="22.5"
              value="0"
              oninput="document.getElementById('segRotationValue').textContent = this.value + '°'"
            />
            <span class="val" id="segRotationValue">0°</span>
          </div>

          <button class="btn btn-primary" onclick="applySegments()">
            应用分段
          </button>

          <div class="presets" id="segmentPresets"></div>
        </div>

        <!-- 渐变模式 -->
        <div class="card card-span-2">
          <div class="card-title">
            渐变模式 <small>16 色调色板循环</small>
          </div>

          <textarea
            id="customColorInput"
            placeholder="#ff0000, #00ff00, #0000ff"
          ></textarea>

          <div class="gradient-controls">
            <button class="btn btn-primary" onclick="applyCustomInput()">
              应用渐变
            </button>
            <div class="speed-row">
              <span>速度</span>
              <input
                type="range"
                id="speedControl"
                min="1"
                max="10"
                value="10"
              />
              <span class="val" id="speedValue">10</span>
            </div>
          </div>

          <div class="help">
            单色 = 输入 1 个颜色；渐变 = 多个用逗号或换行分隔
          </div>

          <div class="presets" id="gradientPresets"></div>
        </div>
      </div>

      <footer>ARGB Controller · 简约模式</footer>
    </div>

    <script>
      let connected = false;
      let lastGradientColors = [];

      const singlePresetColors = [
        "#ff0000",
        "#ff7f00",
        "#ffff00",
        "#00ff00",
        "#00ffff",
        "#0000ff",
        "#8b00ff",
        "#ff00ff",
        "#ffffff",
        "#000000",
      ];

      const gradientPresets = {
        rainbow: [
          "#ff0000",
          "#ff7f00",
          "#ffff00",
          "#00ff00",
          "#0000ff",
          "#4b0082",
          "#9400d3",
          "#ff0000",
        ],
        synthwave: [
          "#f72585",
          "#7209b7",
          "#3a0ca3",
          "#4361ee",
          "#4cc9f0",
          "#f72585",
        ],
        fire: ["#ff0000", "#ff8800", "#ffff00", "#ff0000"],
        lava: ["#000000", "#ff4500", "#ff0000", "#200000", "#000000"],
        aurora: ["#00ff88", "#00ffff", "#8800ff", "#00ff88"],
        ice: ["#add8e6", "#00ffff", "#f0ffff", "#00ffff", "#add8e6"],
        forest: ["#00ff7f", "#228b22", "#f0e68c", "#228b22", "#00ff7f"],
        cottonCandy: ["#f8cdda", "#ffffff", "#84d2f6", "#ffffff", "#f8cdda"],
        sunrise: ["#2d388a", "#00aeef", "#fdb913", "#f15a24", "#2d388a"],
        matrix: [
          "#00ff00",
          "#00c000",
          "#008000",
          "#004000",
          "#000000",
          "#004000",
          "#008000",
          "#00c000",
          "#00ff00",
        ],
      };

      const segmentPresets = {
        "红绿蓝黄": ["#ff0000", "#00ff00", "#0000ff", "#ffff00"],
        "红白蓝": ["#ff0000", "#ffffff", "#0000ff", "#ffffff"],
        "暖色": ["#ff0000", "#ff7f00", "#ffff00", "#ffd700"],
        "冷色": ["#0000ff", "#00ffff", "#8b00ff", "#ff00ff"],
        "复古": ["#8b00ff", "#ff00ff", "#ff7f00", "#ffff00"],
        "黑金": ["#000000", "#ffd700", "#000000", "#ffd700"],
      };

      const rgbToHex = (r, g, b) =>
        `#${[r, g, b]
          .map((c) => ("0" + Math.round(c).toString(16)).slice(-2))
          .join("")}`;
      function hexToRgb(hex) {
        const r = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);
        return r
          ? {
              r: parseInt(r[1], 16),
              g: parseInt(r[2], 16),
              b: parseInt(r[3], 16),
            }
          : null;
      }
      const lerp = (a, b, f) => a + f * (b - a);
      function expandPalette(sourceColors, targetSize = 16) {
        if (!sourceColors || sourceColors.length === 0)
          return new Array(targetSize).fill("#000000");
        if (sourceColors.length === 1)
          return new Array(targetSize).fill(sourceColors[0]);
        const out = [];
        for (let i = 0; i < targetSize; i++) {
          const p = (i / (targetSize - 1)) * (sourceColors.length - 1);
          const i1 = Math.floor(p);
          const i2 = Math.min(i1 + 1, sourceColors.length - 1);
          const f = p - i1;
          const c1 = hexToRgb(sourceColors[i1]);
          const c2 = hexToRgb(sourceColors[i2]);
          if (c1 && c2)
            out.push(
              rgbToHex(
                lerp(c1.r, c2.r, f),
                lerp(c1.g, c2.g, f),
                lerp(c1.b, c2.b, f)
              )
            );
        }
        return out;
      }
      function parseColorString(str) {
        str = (str || "").trim();
        if (str.startsWith("#")) {
          return /^#([a-f\d]{6})$/i.test(str) ? str : null;
        }
        const parts = str.split(",").map((s) => parseInt(s, 10));
        if (
          parts.length === 3 &&
          parts.every((c) => !isNaN(c) && c >= 0 && c <= 255)
        ) {
          return rgbToHex(parts[0], parts[1], parts[2]);
        }
        return null;
      }
      function updateCustomInputDisplay(colors) {
        document.getElementById("customColorInput").value = colors.join(", ");
      }

      async function sendJsonCommand(jsonObj) {
        if (!connected) {
          alert("请先连接串口");
          return;
        }
        try {
          const resp = await fetch("/api/send", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(jsonObj),
          });
          const data = await resp.json();
          if (!data.success) console.error("发送失败: " + data.msg);
        } catch (e) {
          console.error("通信失败: " + e);
        }
      }
      async function connect() {
        const portName = document.getElementById("portInput").value.trim();
        if (!portName) {
          alert("请输入串口/设备路径");
          return;
        }
        try {
          const resp = await fetch("/api/connect", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ port: portName }),
          });
          const data = await resp.json();
          if (data.success) connected = true;
        } catch (e) {
          alert("连接失败: " + e);
        }
        updateConnectionUI();
      }
      async function disconnect() {
        try {
          await fetch("/api/disconnect", { method: "POST" });
        } catch (e) {}
        connected = false;
        updateConnectionUI();
      }
      function toggleConnection() {
        if (connected) disconnect();
        else connect();
      }
      function updateConnectionUI() {
        const portInput = document.getElementById("portInput");
        const toggleBtn = document.getElementById("toggleConnectionBtn");
        const statusDiv = document.getElementById("connectionStatus");
        if (connected) {
          toggleBtn.textContent = "断开";
          toggleBtn.className = "btn btn-danger";
          portInput.disabled = true;
          statusDiv.className = "status-dot connected";
          statusDiv.textContent = portInput.value || "已连接";
        } else {
          toggleBtn.textContent = "连接";
          toggleBtn.className = "btn btn-primary";
          portInput.disabled = false;
          statusDiv.className = "status-dot disconnected";
          statusDiv.textContent = "未连接";
        }
      }

      function turnOff() {
        sendJsonCommand({ mode: "static", color: "#000000" });
        updateCustomInputDisplay(["#000000"]);
      }
      function setStaticPreset(hexColor) {
        sendJsonCommand({ mode: "static", color: hexColor });
        updateCustomInputDisplay([hexColor]);
      }
      function applySingleColor() {
        const c = document.getElementById("singleColor").value;
        setStaticPreset(c);
      }
      function applySegments() {
        const colors = [0, 1, 2, 3].map((i) =>
          document.getElementById(`segColor${i}`).value
        );
        const deg = parseFloat(document.getElementById("segRotation").value);
        const offset = Math.round((deg / 360) * 16) % 16;
        sendJsonCommand({ mode: "segments", colors, offset });
      }
      function setSegmentPreset(name) {
        const colors = segmentPresets[name];
        if (!colors) return;
        colors.forEach((c, i) => {
          document.getElementById(`segColor${i}`).value = c;
        });
        applySegments();
      }
      function startGradient(colors) {
        if (!colors || colors.length === 0) return;
        const speed = parseInt(document.getElementById("speedControl").value);
        const expanded = expandPalette(colors, 16);
        const speedMap = [200, 150, 120, 100, 80, 65, 55, 50, 30, 15];
        sendJsonCommand({
          mode: "gradient",
          colors: expanded,
          speed: speedMap[speed - 1] || 15,
        });
      }
      function setGradientPreset(name) {
        const colors = gradientPresets[name];
        if (!colors) return;
        lastGradientColors = colors;
        updateCustomInputDisplay(colors);
        startGradient(colors);
      }
      function applyCustomInput() {
        const text = document.getElementById("customColorInput").value;
        const colorStrings = text
          .split(/[\n,]/)
          .map((s) => s.trim())
          .filter(Boolean);
        const validColors = colorStrings.map(parseColorString).filter(Boolean);
        if (validColors.length === 0) {
          alert("未检测到有效的颜色值");
          return;
        }
        updateCustomInputDisplay(validColors);
        if (validColors.length === 1) {
          sendJsonCommand({ mode: "static", color: validColors[0] });
        } else {
          lastGradientColors = validColors;
          startGradient(validColors);
        }
      }
      async function applySchedule() {
        const startTime = document.getElementById("startTime").value;
        const endTime = document.getElementById("endTime").value;
        if (!startTime || !endTime) {
          alert("请选择有效的开始和结束时间");
          return;
        }
        try {
          const resp = await fetch("/api/schedule", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ start_time: startTime, end_time: endTime }),
          });
          const data = await resp.json();
          if (data.success) alert("定时计划已保存");
        } catch (e) {
          alert("应用失败: " + e);
        }
      }

      function makeStrip(colors) {
        const s = document.createElement("div");
        s.className = "preset-strip";
        colors.forEach((c) => {
          const span = document.createElement("span");
          span.style.background = c;
          s.appendChild(span);
        });
        return s;
      }
      function renderPresets() {
        const sp = document.getElementById("singlePresets");
        singlePresetColors.forEach((c) => {
          const d = document.createElement("div");
          d.className = "preset";
          d.style.background = c;
          d.title = c;
          d.onclick = () => {
            document.getElementById("singleColor").value = c;
            setStaticPreset(c);
          };
          sp.appendChild(d);
        });

        const segp = document.getElementById("segmentPresets");
        Object.entries(segmentPresets).forEach(([name, colors]) => {
          const item = document.createElement("div");
          item.className = "preset-item";
          const strip = makeStrip(colors);
          strip.title = name;
          strip.onclick = () => setSegmentPreset(name);
          const label = document.createElement("div");
          label.className = "preset-name";
          label.textContent = name;
          item.appendChild(strip);
          item.appendChild(label);
          segp.appendChild(item);
        });

        const gp = document.getElementById("gradientPresets");
        Object.entries(gradientPresets).forEach(([name, colors]) => {
          const item = document.createElement("div");
          item.className = "preset-item";
          const strip = makeStrip(colors);
          strip.title = name;
          strip.onclick = () => setGradientPreset(name);
          const label = document.createElement("div");
          label.className = "preset-name";
          label.textContent = name;
          item.appendChild(strip);
          item.appendChild(label);
          gp.appendChild(item);
        });
      }

      async function initializeApp() {
        try {
          const response = await fetch("/api/config");
          const config = await response.json();
          const portInput = document.getElementById("portInput");
          if (config.is_connected && config.connected_port) {
            connected = true;
            portInput.value = config.connected_port;
          } else {
            connected = false;
            if (config.default_com_port)
              portInput.value = config.default_com_port;
          }
          updateConnectionUI();
          if (config.last_light_state) {
            const state = config.last_light_state;
            if (state.mode === "static")
              updateCustomInputDisplay([state.color]);
            else if (state.mode === "gradient" && state.colors) {
              updateCustomInputDisplay(state.colors);
              lastGradientColors = state.colors;
            } else if (state.mode === "segments" && state.colors) {
              state.colors.forEach((c, i) => {
                if (i < 4)
                  document.getElementById(`segColor${i}`).value = c;
              });
              if (typeof state.offset === "number") {
                const deg = Math.round((state.offset / 16) * 360);
                document.getElementById("segRotation").value = deg;
                document.getElementById("segRotationValue").textContent =
                  deg + "°";
              }
            }
          }
          if (config.schedule) {
            document.getElementById("startTime").value =
              config.schedule.start_time || "00:00";
            document.getElementById("endTime").value =
              config.schedule.end_time || "08:00";
          }
        } catch (error) {
          console.error("无法获取后端配置:", error);
        }
        document
          .getElementById("speedControl")
          .addEventListener("input", function () {
            document.getElementById("speedValue").textContent = this.value;
            startGradient(lastGradientColors);
          });
      }

      document.addEventListener("DOMContentLoaded", () => {
        renderPresets();
        initializeApp();
      });
    </script>
  </body>
</html>
